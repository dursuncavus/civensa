{% macro search(id) -%}
<label class="directorate-search">Müdürlük ara<input type="search" data-directorate-search="{{ id }}" aria-controls="{{ id }}" autocomplete="off"></label>
<p id="{{ id }}-status" role="status" aria-live="polite"></p>
{%- endmacro %}
{% macro detail(id, title, summary) -%}
<article class="directorate-card" data-directorate-card="{{ title }}">
  <header class="directorate-head"><h3>{{ title }}</h3></header>
  <p>{{ summary }}</p>
  <button type="button" class="button" data-open-dialog="{{ id }}" aria-haspopup="dialog">Ayrıntıyı aç</button>
</article>
<dialog class="directorate-dialog" id="{{ id }}" aria-labelledby="{{ id }}-title">
  <header><h2 id="{{ id }}-title">{{ title }}</h2><form method="dialog"><button class="button">Kapat</button></form></header>
  {{ caller() }}
</dialog>
{%- endmacro %}
