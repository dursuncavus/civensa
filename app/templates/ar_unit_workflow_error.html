{% extends 'base.html' %}
{% block page_title %}Birim faaliyet raporu işlemi tamamlanamadı{% endblock %}
{% block content %}
<section class="panel" style="padding:24px"><p role="alert">{{ message }}</p>
<p><a href="{{ back }}">Raporun son sürümünü aç</a></p>
{% if action in ['return','reopen'] %}<form method="post">
<input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token') }}">
<input type="hidden" name="expected_revision" value="{{ revision }}">
<label>Gerekçe<textarea name="reason" rows="4" maxlength="10000" required>{{ reason }}</textarea></label>
<button class="button">Yeniden dene</button></form>{% endif %}</section>
{% endblock %}
