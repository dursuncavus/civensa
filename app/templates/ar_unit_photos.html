<section class="panel unit-table-panel" id="photos{{ '-department-'~unit.department_id if unit.department_id else '' }}"><h2>Faaliyet fotoğrafları</h2><p>Tablo 7 faaliyetleri için isteğe bağlı JPG/PNG yükleyin. Fotoğraflar rapor sırasına göre numaralanır.</p>
{% for photo in unit.photos %}<figure><img src="{{ photo.url }}" alt="{{ photo.caption }}" loading="lazy"><figcaption>{{ photo.label }} · {{ photo.caption }}</figcaption></figure>{% else %}<p>Henüz faaliyet fotoğrafı yok.</p>{% endfor %}
{% if editable %}<form method="post" enctype="multipart/form-data" action="/activity-sections/reports/{{ report.id }}/unit-tables/photos/upload"><input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token') }}"><input type="hidden" name="expected_revision" value="{{ report.revision }}">
<label>Faaliyet<select name="activity_key" required>{% for row in data.tables['7'].rows %}<option value="{{ row.key }}" {% if photo_attempt and photo_attempt.activity_key==row.key %}selected{% endif %}>{{ row.activity }}</option>{% endfor %}</select></label>
<label>Fotoğraf açıklaması<input name="caption" required maxlength="1000" value="{{ photo_attempt.caption if photo_attempt else '' }}"></label><label>JPG/PNG dosyası<input type="file" name="file" accept=".jpg,.jpeg,.png" required></label><button class="button">Fotoğraf yükle</button></form>{% endif %}
</section>
