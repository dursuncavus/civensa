title = "Civensa CI secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Disposable local/CI PostgreSQL password; never used for a deployed service"
regexTarget = "secret"
regexes = ['''^disposable_test_only$''']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Historical fake login password in the live-pilot regression fixture only"
condition = "AND"
paths = ['''^tests/test_live_pilot_hardening\.py$''']
regexTarget = "secret"
regexes = ['''^Eski-Parola-2027$''']

[[rules.allowlists]]
description = "CIV-087: fake local test password and a form field name in regression tests only"
condition = "AND"
paths = ['''^tests/test_activity_contract_errors\.py$''', '''^tests/test_storage_upload_limits\.py$''']
regexTarget = "secret"
regexes = ['''^Yerel-test-parolasi-123$''', '''^figure_label_0=$''']
