name: Install verified age
description: age 1.2.1 for Linux amd64, pinned to its release archive SHA256
runs:
  using: composite
  steps:
    # The archive is cached by its pinned SHA256; a cached copy is verified the same way as a download.
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/civ092-age-cache
        key: age-v1.2.1-linux-amd64-7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50
    - shell: bash
      run: |
        set -euo pipefail
        install -d -m 700 "$RUNNER_TEMP/civ092-age" "$RUNNER_TEMP/civ092-age-cache"
        archive="$RUNNER_TEMP/civ092-age-cache/age.tar.gz"
        if [ ! -s "$archive" ]; then
          # GitHub release downloads intermittently return 504; retry for up to 5 minutes.
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 15 --retry-max-time 300 --retry-all-errors \
            https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz \
            -o "$archive"
        fi
        echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$RUNNER_TEMP/civ092-age" age/age age/age-keygen
        echo "$RUNNER_TEMP/civ092-age/age" >> "$GITHUB_PATH"
