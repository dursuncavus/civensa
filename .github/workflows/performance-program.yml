name: Performance program validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: civensa_test
          POSTGRES_USER: civensa_test
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civensa_test -d civensa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIVENSA_TEST_POSTGRES_URL: postgresql+psycopg://civensa_test:disposable_test_only@localhost:5432/civensa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q --require-postgres
      - run: python -m compileall -q app
      - run: node --check app/static/app.js
