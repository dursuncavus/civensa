name: CIV-058 guarded cleanup validation

on:
  pull_request:
    paths:
      - 'scripts/clear_preprint_2027.py'
      - 'scripts/first_load_live.py'
      - 'scripts/rehearse_clear_preprint_2027.py'
      - 'tests/test_clear_preprint_2027.py'
      - 'docs/first-load/live-runbook.md'
      - '.github/workflows/clear-preprint.yml'
      - '.github/actions/setup-age/**'
      - 'ops/backup_crypto.py'
      - 'ops/preprint_rehearsal.py'
      - 'ops/release_rehearsal.py'
      - '.github/workflows/db-backup.yml'
      - '.github/workflows/preprint-backup-rehearsal.yml'
      - '.github/workflows/release-rehearsal.yml'
      - 'ops/backup_self_test.py'
      - 'ops/test_backup_security.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civ058-guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: civensa_test
          POSTGRES_USER: civensa_test
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --log-driver=none
          --health-cmd "pg_isready -U civensa_test -d civensa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIVENSA_TEST_POSTGRES_URL: postgresql+psycopg://civensa_test:disposable_test_only@localhost:5432/civensa_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
      - uses: ./.github/actions/setup-age
      - run: python -m pip install -r requirements-dev.txt PyYAML==6.0.3
      - name: Encrypted backup boundary and disposable restore self-test
        run: |
          python -m unittest ops.test_backup_security -v
          python -m ops.backup_self_test
      - name: Guard refusals, zero writes, rollback and printed-load chain
        run: >-
          python -m pytest -q --require-postgres -x
          tests/test_clear_preprint_2027.py --durations=10
