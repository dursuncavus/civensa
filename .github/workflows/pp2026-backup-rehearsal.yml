name: 2026 PP verified backup rehearsal

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Varsayılan daldaki yeşil Daily verified database backup çalışma numarası'
        required: true
        type: string
      book_confirmation:
        description: 'Yalnız geçici kopya için kitap SHA256 öneki: 1aaa0bb81c3c'
        required: true
        type: string
      organization_id:
        description: 'İsteğe bağlı kurum kimliği; boşsa yedekteki tek kurum'
        type: string
      actor_id:
        description: 'İsteğe bağlı etkin Strateji/yönetici kimliği; boşsa mevcut etkin hesap'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: civ168-backup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: civ168_rehearsal
          POSTGRES_USER: civ168_rehearsal
          POSTGRES_PASSWORD: disposable_rehearsal_only
        ports:
          - 5432:5432
        options: >-
          --log-driver=none
          --health-cmd "pg_isready -U civ168_rehearsal -d civ168_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CIVENSA_TEST_POSTGRES_URL: postgresql+psycopg://civ168_rehearsal:disposable_rehearsal_only@127.0.0.1:5432/civ168_rehearsal
      CIV168_TMP_ROOT: ${{ github.workspace }}/civ168-private
      TMPDIR: ${{ github.workspace }}/civ168-private
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-age
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and PostgreSQL 18 clients
        run: |
          python -m pip install -r requirements.txt
          docker pull postgres:18
          mkdir -m 700 civ168-private civ168-client-bin
          cat > civ168-client-bin/pg-client <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          CIV168_CLIENT_TOOL="$(basename "$0")"
          exec docker run --rm --log-driver=none --network host \
            --user "$(id -u):$(id -g)" \
            --env PGDATABASE --env PGHOST --env PGHOSTADDR --env PGPORT \
            --env PGUSER --env PGPASSWORD --env PGCONNECT_TIMEOUT \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$CIV168_TMP_ROOT:$CIV168_TMP_ROOT" \
            --workdir "$GITHUB_WORKSPACE" postgres:18 "$CIV168_CLIENT_TOOL" "$@"
          SH
          chmod 700 civ168-client-bin/pg-client
          ln -s pg-client civ168-client-bin/pg_dump
          ln -s pg-client civ168-client-bin/pg_restore
          echo "$GITHUB_WORKSPACE/civ168-client-bin" >> "$GITHUB_PATH"
      - name: Restore verified artifact and rehearse only in disposable PostgreSQL
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          GH_TOKEN: ${{ github.token }}
          CIVENSA_REHEARSAL_BACKUP_RUN: ${{ inputs.backup_run_id }}
          CIVENSA_REHEARSAL_BOOK_CONFIRM: ${{ inputs.book_confirmation }}
          CIVENSA_REHEARSAL_ORG_ID: ${{ inputs.organization_id }}
          CIVENSA_REHEARSAL_ACTOR_ID: ${{ inputs.actor_id }}
        run: python -m ops.pp2026_rehearsal
      - name: Delete private backup copies
        if: always()
        run: rm -rf -- rehearsal-backup civ168-private civ168-client-bin
